<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja de Carro</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <nav id="menu"></nav>

    <h1>Loja de Carro</h1>
    <ul>
        <li id="linkCarros"><a href="carros.html">Cadastro de Carros</a></li>
        <li id="linkUsuarios"><a href="usuarios.html">Gerenciar Usuários</a></li>
        <li id="linkLogs"><a href="logs.html">Logs do Sistema</a></li>
    </ul>

    <script>
        montarMenu().then(function (usuario) {
            if (!usuario) {
                return;
            }
            const administrador = usuario.papel === "ADMIN";
            document.getElementById("linkCarros").hidden = !administrador;
            document.getElementById("linkUsuarios").hidden = !administrador;
            document.getElementById("linkLogs").hidden = !administrador;
        });
    </script>
</body>
</html>

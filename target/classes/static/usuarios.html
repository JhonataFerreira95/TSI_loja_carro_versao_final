<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <nav id="menu"></nav>

    <h1 id="tituloPagina">Minha conta</h1>

    <form id="formUsuario">
        <input type="hidden" id="id">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>

        <label for="senha">Senha (mínimo 6 caracteres):</label>
        <input type="password" id="senha">
        <small id="dicaSenha" hidden>Deixe em branco para manter a senha atual.</small>

        <div id="campoPapel" hidden>
            <label for="papel">Papel:</label>
            <select id="papel">
                <option value="USER">Usuário</option>
                <option value="ADMIN">Administrador</option>
            </select>
        </div>

        <br>
        <button type="submit" id="btnSalvar">Cadastrar</button>
        <button type="button" id="btnCancelar" onclick="limparFormulario()">Cancelar</button>
    </form>

    <div id="mensagem" class="mensagem"></div>

    <section id="gerenciarUsuarios" hidden>
    <h2>Usuários cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Papel</th>
                <th>Data de cadastro</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaUsuarios"></tbody>
    </table>
    </section>

    <script>
        let administrador = false;

        async function listarUsuarios() {
            const resposta = await api("/usuario/listarUsuarios");
            const usuarios = await resposta.json();
            const tabela = document.getElementById("tabelaUsuarios");
            tabela.innerHTML = "";

            usuarios.forEach(function (u) {
                const linha = adicionarLinha(tabela, [
                    u.id, u.nome, u.email, u.papel, formatarData(u.dataCadastro)
                ]);
                adicionarAcoes(linha,
                    function () { editarUsuario(u); },
                    function () { excluirUsuario(u.id); });
            });
        }

        async function salvarUsuario(evento) {
            evento.preventDefault();
            const id = document.getElementById("id").value;
            const usuario = {
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value,
                papel: administrador ? document.getElementById("papel").value : undefined
            };

            const resposta = id
                ? await enviarJson("/usuario/" + id, "PUT", usuario)
                : await enviarJson("/usuario/salvar", "POST", usuario);

            if (resposta.ok) {
                mostrarMensagem(id ? "Usuário atualizado com sucesso." : "Usuário cadastrado com sucesso.", false);
                if (administrador) {
                    limparFormulario();
                    listarUsuarios();
                } else {
                    const atualizado = await resposta.json();
                    document.getElementById("nome").value = atualizado.nome;
                    document.getElementById("email").value = atualizado.email;
                }
                montarMenu();
            } else {
                mostrarMensagem(await lerErro(resposta), true);
            }
        }

        function editarUsuario(u) {
            document.getElementById("id").value = u.id;
            document.getElementById("nome").value = u.nome;
            document.getElementById("email").value = u.email;
            document.getElementById("senha").value = "";
            document.getElementById("papel").value = u.papel;
            document.getElementById("dicaSenha").hidden = false;
            document.getElementById("btnSalvar").textContent = "Atualizar";
        }

        async function excluirUsuario(id) {
            if (!confirm("Deseja realmente excluir o usuário " + id + "?")) {
                return;
            }
            const resposta = await api("/usuario/" + id, { method: "DELETE" });
            if (resposta.ok) {
                mostrarMensagem("Usuário excluído com sucesso.", false);
                listarUsuarios();
            } else {
                mostrarMensagem(await lerErro(resposta), true);
            }
        }

        function limparFormulario() {
            document.getElementById("formUsuario").reset();
            document.getElementById("id").value = "";
            document.getElementById("dicaSenha").hidden = true;
            document.getElementById("papel").value = "USER";
            document.getElementById("btnSalvar").textContent = "Cadastrar";
        }

        document.getElementById("formUsuario").addEventListener("submit", salvarUsuario);
        montarMenu().then(async function (usuario) {
            if (!usuario) {
                return;
            }
            administrador = usuario.papel === "ADMIN";
            if (administrador) {
                document.getElementById("tituloPagina").textContent = "Gerenciar Usuários";
                document.getElementById("campoPapel").hidden = false;
                document.getElementById("gerenciarUsuarios").hidden = false;
                listarUsuarios();
            } else {
                document.getElementById("id").value = usuario.id;
                document.getElementById("nome").value = usuario.nome;
                document.getElementById("email").value = usuario.email;
                document.getElementById("btnSalvar").textContent = "Salvar alterações";
                document.getElementById("btnCancelar").hidden = true;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Carros</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <nav id="menu"></nav>

    <h1 id="tituloCarros">Cadastro de Carros</h1>

    <form id="formCarro">
        <input type="hidden" id="id">

        <label for="modelo">Modelo (menos de 5 caracteres):</label>
        <input type="text" id="modelo" maxlength="4" required>

        <label for="ano">Ano:</label>
        <input type="number" id="ano" required>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" step="0.01" min="0" required>

        <div id="campoContaAssociada" hidden>
            <label for="usuarioId">Conta associada:</label>
            <select id="usuarioId"></select>
        </div>

        <label for="imagem">Imagem do computador (opcional):</label>
        <input type="file" id="imagem" accept="image/jpeg,image/png,image/gif,image/webp">

        <br>
        <button type="submit" id="btnSalvar">Cadastrar</button>
        <button type="button" onclick="limparFormulario()">Cancelar</button>
    </form>

    <div id="mensagem" class="mensagem"></div>

    <h2>Carros cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Preço</th>
                <th id="cabecalhoContaAssociada">Conta associada</th>
                <th>Imagem</th>
                <th id="cabecalhoAcoes">Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaCarros"></tbody>
    </table>

    <script>
        let idAdministradorAtual = "";
        let administrador = false;

        async function listarCarros() {
            const resposta = await api(administrador ? "/carro/listarCarros" : "/carro/meusCarros");
            if (!resposta.ok) {
                mostrarMensagem(await lerErro(resposta), true);
                return;
            }
            const carros = await resposta.json();
            const tabela = document.getElementById("tabelaCarros");
            tabela.innerHTML = "";

            carros.forEach(function (c) {
                const cadastradoPor = c.cadastradoPor ? c.cadastradoPor.nome : "";
                const preco = c.preco.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
                const linha = adicionarLinha(tabela, [c.id, c.modelo, c.ano, preco, cadastradoPor, ""]);
                linha.children[4].hidden = !administrador;
                if (c.imagem) {
                    const imagem = document.createElement("img");
                    imagem.src = c.imagem;
                    imagem.alt = "Imagem do carro " + c.modelo;
                    imagem.width = 120;
                    imagem.loading = "lazy";
                    linha.children[5].appendChild(imagem);
                }
                if (administrador) {
                    adicionarAcoes(linha,
                        function () { editarCarro(c); },
                        function () { excluirCarro(c.id); });
                    if (c.imagem) {
                        const acao = linha.lastElementChild;
                        const botaoRemoverImagem = document.createElement("button");
                        botaoRemoverImagem.textContent = "Remover foto";
                        botaoRemoverImagem.onclick = function () { removerImagemCarro(c.id); };
                        acao.appendChild(document.createTextNode(" "));
                        acao.appendChild(botaoRemoverImagem);
                    }
                }
            });
        }

        async function salvarCarro(evento) {
            evento.preventDefault();
            const id = document.getElementById("id").value;
            const dados = new FormData();
            dados.append("modelo", document.getElementById("modelo").value);
            dados.append("ano", document.getElementById("ano").value);
            dados.append("preco", document.getElementById("preco").value);
            if (administrador) {
                dados.append("usuarioId", document.getElementById("usuarioId").value);
            }
            const imagem = document.getElementById("imagem").files[0];
            if (imagem) {
                dados.append("imagem", imagem);
            }

            const resposta = await api(id ? "/carro/" + id : "/carro/salvar", {
                method: id ? "PUT" : "POST",
                body: dados
            });

            if (resposta.ok) {
                mostrarMensagem(id ? "Carro atualizado com sucesso." : "Carro cadastrado com sucesso.", false);
                limparFormulario();
                listarCarros();
            } else {
                mostrarMensagem(await lerErro(resposta), true);
            }
        }

        function editarCarro(c) {
            document.getElementById("id").value = c.id;
            document.getElementById("modelo").value = c.modelo;
            document.getElementById("ano").value = c.ano;
            document.getElementById("preco").value = c.preco;
            document.getElementById("usuarioId").value = c.cadastradoPor ? c.cadastradoPor.id : "";
            document.getElementById("imagem").value = "";
            document.getElementById("btnSalvar").textContent = "Atualizar";
        }

        async function excluirCarro(id) {
            if (!confirm("Deseja realmente excluir o carro " + id + "?")) {
                return;
            }
            const resposta = await api("/carro/" + id, { method: "DELETE" });
            if (resposta.ok) {
                mostrarMensagem("Carro excluído com sucesso.", false);
                listarCarros();
            } else {
                mostrarMensagem(await lerErro(resposta), true);
            }
        }

        async function removerImagemCarro(id) {
            if (!confirm("Deseja realmente remover a foto deste carro?")) {
                return;
            }
            const resposta = await api("/carro/" + id + "/imagem", { method: "DELETE" });
            if (resposta.ok) {
                mostrarMensagem("Foto removida com sucesso.", false);
                listarCarros();
            } else {
                mostrarMensagem(await lerErro(resposta), true);
            }
        }

        function limparFormulario() {
            document.getElementById("formCarro").reset();
            document.getElementById("id").value = "";
            document.getElementById("usuarioId").value = idAdministradorAtual;
            document.getElementById("btnSalvar").textContent = "Cadastrar";
        }

        async function listarContasAssociadas(usuarioLogado) {
            const resposta = await api("/usuario/listarUsuarios");
            if (!resposta.ok) {
                mostrarMensagem(await lerErro(resposta), true);
                return;
            }

            const contas = await resposta.json();
            const seletor = document.getElementById("usuarioId");
            seletor.innerHTML = "";
            idAdministradorAtual = usuarioLogado.id;
            contas.forEach(function (conta) {
                const opcao = document.createElement("option");
                opcao.value = conta.id;
                opcao.textContent = conta.id === usuarioLogado.id
                    ? conta.nome + " (administrador)"
                    : conta.nome;
                seletor.appendChild(opcao);
            });
            seletor.value = usuarioLogado.id;
        }

        document.getElementById("formCarro").addEventListener("submit", salvarCarro);
        montarMenu().then(async function (usuario) {
            if (usuario) {
                administrador = usuario.papel === "ADMIN";
                document.getElementById("tituloCarros").textContent = administrador
                    ? "Cadastro de Carros"
                    : "Meus carros";
                document.getElementById("campoContaAssociada").hidden = !administrador;
                document.getElementById("cabecalhoContaAssociada").hidden = !administrador;
                document.getElementById("cabecalhoAcoes").hidden = !administrador;
                if (administrador) {
                    await listarContasAssociadas(usuario);
                }
                listarCarros();
            }
        });
    </script>
</body>
</html>

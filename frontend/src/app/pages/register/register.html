<section class="card auth-card">
  <h1>Criar conta</h1>
  @if (mensagem) { <div class="message" [class.error]="erro" [class.success]="!erro">{{ mensagem }}</div> }
  <form [formGroup]="form" (ngSubmit)="cadastrar()">
    <label class="field">Nome
      <input formControlName="nome" />
      @if (form.controls['nome'].touched && form.controls['nome'].invalid) { <small class="field-error">Informe pelo menos 3 caracteres.</small> }
    </label>
    <label class="field">E-mail
      <input type="email" formControlName="email" />
      @if (form.controls['email'].touched && form.controls['email'].invalid) { <small class="field-error">Informe um e-mail válido.</small> }
    </label>
    <label class="field">Senha
      <input type="password" formControlName="senha" />
      @if (form.controls['senha'].touched && form.controls['senha'].invalid) { <small class="field-error">A senha deve ter pelo menos 6 caracteres.</small> }
    </label>
    <button type="submit" [disabled]="loading || form.invalid">{{ loading ? 'Criando...' : 'Criar conta' }}</button>
  </form>
  <p>Já possui conta? <a routerLink="/login">Entrar</a></p>
</section>

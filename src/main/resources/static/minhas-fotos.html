<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas fotos</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <nav id="menu"></nav>

    <h1>Fotos dos meus carros</h1>
    <p>Você pode enviar ou remover fotos dos carros associados à sua conta.</p>
    <div id="mensagem" class="mensagem"></div>
    <p id="semCarros" hidden>Nenhum carro está cadastrado na sua conta.</p>

    <table>
        <thead>
            <tr>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Foto atual</th>
                <th>Nova foto</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaCarros"></tbody>
    </table>

    <script>
        async function listarMeusCarros() {
            const resposta = await api("/carro/meusCarros");
            if (!resposta.ok) {
                mostrarMensagem(await lerErro(resposta), true);
                return;
            }

            const carros = await resposta.json();
            const tabela = document.getElementById("tabelaCarros");
            tabela.innerHTML = "";
            document.getElementById("semCarros").hidden = carros.length !== 0;

            carros.forEach(function (carro) {
                const linha = adicionarLinha(tabela, [carro.modelo, carro.ano, "", "", ""]);
                if (carro.imagem) {
                    const foto = document.createElement("img");
                    foto.src = carro.imagem;
                    foto.alt = "Foto do carro " + carro.modelo;
                    foto.width = 120;
                    foto.loading = "lazy";
                    linha.children[2].appendChild(foto);
                }

                const seletor = document.createElement("input");
                seletor.type = "file";
                seletor.accept = "image/jpeg,image/png,image/gif,image/webp";
                seletor.setAttribute("aria-label", "Selecionar nova foto para " + carro.modelo);
                linha.children[3].appendChild(seletor);

                const botaoEnviar = document.createElement("button");
                botaoEnviar.textContent = "Enviar foto";
                botaoEnviar.onclick = function () { enviarFoto(carro.id, seletor); };
                linha.children[4].appendChild(botaoEnviar);

                if (carro.imagem) {
                    const botaoRemover = document.createElement("button");
                    botaoRemover.textContent = "Remover foto";
                    botaoRemover.onclick = function () { removerFoto(carro.id); };
                    linha.children[4].appendChild(document.createTextNode(" "));
                    linha.children[4].appendChild(botaoRemover);
                }
            });
        }

        async function enviarFoto(id, seletor) {
            const arquivo = seletor.files[0];
            if (!arquivo) {
                mostrarMensagem("Selecione uma imagem do computador.", true);
                return;
            }

            const dados = new FormData();
            dados.append("imagem", arquivo);
            const resposta = await api("/carro/" + id + "/imagem", {
                method: "PUT",
                body: dados
            });
            if (resposta.ok) {
                mostrarMensagem("Foto enviada com sucesso.", false);
                listarMeusCarros();
            } else {
                mostrarMensagem(await lerErro(resposta), true);
            }
        }

        async function removerFoto(id) {
            if (!confirm("Deseja realmente remover esta foto?")) {
                return;
            }
            const resposta = await api("/carro/" + id + "/imagem", { method: "DELETE" });
            if (resposta.ok) {
                mostrarMensagem("Foto removida com sucesso.", false);
                listarMeusCarros();
            } else {
                mostrarMensagem(await lerErro(resposta), true);
            }
        }

        montarMenu().then(function (usuario) {
            if (usuario) {
                listarMeusCarros();
            }
        });
    </script>
</body>
</html>
